[package]
name = "ps3"
version = "0.1.0"
edition = "2021"
description = "A Rust runtime and SDK for the Sony PlayStation 3 (Cell Broadband Engine)"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["rlib"]

[dependencies]
talc = { version = "5.1", default-features = false, features = ["counters"] }
lock_api = { version = "0.4", default-features = false }

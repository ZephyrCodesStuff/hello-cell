[workspace]
members = [".", "moldier"]

[package]
name = "hello-cell"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "EBOOT"
path = "src/main.rs"

[dependencies]
talc = { version = "5.1", default-features = false, features = ["counters"] }
lock_api = { version = "0.4", default-features = false }

[profile.dev]
codegen-units = 1
panic = "abort"
debug = 1
lto = "fat"

[profile.release]
codegen-units = 1
panic = "abort"
debug = 1
lto = "fat"
